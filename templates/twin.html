{% extends "base.html" %}

{% block title %}Digital Twin - Real-time Vitals{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .twin-container {
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }
  
  .glass-panel {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  [data-theme='dark'] .glass-panel {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }

  .glass-panel:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.2);
  }

  .twin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }
  
  .twin-title {
    font-size: 2.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ef4444 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
  }
  
  .status-badge {
    padding: 0.5rem 1.5rem;
    border-radius: 50px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.3);
    animation: pulse 2s infinite;
  }
  
  .status-badge.connected {
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;
    border: 1px solid rgba(16, 185, 129, 0.3);
    animation: none;
  }
  
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: currentColor;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  .metric-card {
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.3s ease;
  }
  
  .metric-card:hover {
    background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
  }

  .metric-value {
    font-size: 2rem;
    font-weight: 700;
    font-family: monospace;
    margin: 0.5rem 0;
    color: var(--text-color);
  }
  
  .metric-label {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  .chart-container {
    position: relative;
    height: 300px;
    width: 100%;
  }
  
  .chart-title {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
</style>
{% endblock %}

{% block body %}
<div class="twin-container">
  <div class="twin-header">
    <h1 class="twin-title"><i class="fa-solid fa-microchip"></i> Digital Twin Dashboard</h1>
    <div id="connStatus" class="status-badge">
      <div class="status-dot"></div>
      <span id="connText">Đang chờ tín hiệu...</span>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="glass-panel metric-card">
      <div class="metric-label"><i class="fa-solid fa-heart-pulse"></i> PPG Tín hiệu</div>
      <div class="metric-value" id="valPPG">0.00</div>
    </div>
    <div class="glass-panel metric-card">
      <div class="metric-label"><i class="fa-solid fa-tachometer-alt"></i> Gia tốc Mag</div>
      <div class="metric-value" id="valAccel">0.00 G</div>
    </div>
    <div class="glass-panel metric-card">
      <div class="metric-label"><i class="fa-solid fa-stopwatch"></i> Độ trễ</div>
      <div class="metric-value" id="valPing">-- ms</div>
    </div>
  </div>

  <div class="glass-panel">
    <div class="chart-title"><i class="fa-solid fa-wave-square" style="color: #ef4444;"></i> Photoplethysmography (PPG)</div>
    <div class="chart-container">
      <canvas id="ppgChart"></canvas>
    </div>
  </div>

  <div class="glass-panel">
    <div class="chart-title"><i class="fa-solid fa-arrows-up-down-left-right" style="color: #3b82f6;"></i> Gia tốc 3 trục (IMU)</div>
    <div class="chart-container">
      <canvas id="imuChart"></canvas>
    </div>
  </div>
</div>

<script>
  const MAX_DATA_POINTS = 200;
  
  const isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
  const textColor = isDarkMode ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 0, 0, 0.7)';

  // Chart Setup: PPG
  const ctxPPG = document.getElementById('ppgChart').getContext('2d');
  const ppgChart = new Chart(ctxPPG, {
    type: 'line',
    data: {
      labels: Array(MAX_DATA_POINTS).fill(''),
      datasets: [
        {
          label: 'PPG Lọc (NLMS)',
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.4,
          data: Array(MAX_DATA_POINTS).fill(null),
          fill: true
        },
        {
          label: 'PPG Thô',
          borderColor: 'rgba(100, 116, 139, 0.5)',
          borderWidth: 1,
          pointRadius: 0,
          tension: 0.4,
          data: Array(MAX_DATA_POINTS).fill(null),
          hidden: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 0 },
      plugins: {
        legend: { labels: { color: textColor } },
        tooltip: { enabled: false }
      },
      scales: {
        x: { display: false },
        y: {
          display: true,
          grid: { color: gridColor },
          ticks: { color: textColor },
          min: -2,
          max: 2
        }
      }
    }
  });

  // Chart Setup: IMU
  const ctxIMU = document.getElementById('imuChart').getContext('2d');
  const imuChart = new Chart(ctxIMU, {
    type: 'line',
    data: {
      labels: Array(MAX_DATA_POINTS).fill(''),
      datasets: [
        { label: 'Trục X', borderColor: '#ef4444', borderWidth: 1.5, pointRadius: 0, data: Array(MAX_DATA_POINTS).fill(null) },
        { label: 'Trục Y', borderColor: '#10b981', borderWidth: 1.5, pointRadius: 0, data: Array(MAX_DATA_POINTS).fill(null) },
        { label: 'Trục Z', borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0, data: Array(MAX_DATA_POINTS).fill(null) }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 0 },
      plugins: {
        legend: { labels: { color: textColor } },
        tooltip: { enabled: false }
      },
      scales: {
        x: { display: false },
        y: {
          display: true,
          grid: { color: gridColor },
          ticks: { color: textColor },
          min: -2,
          max: 2
        }
      }
    }
  });

  // WebSocket Connection
  let ws = null;
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = protocol + '//' + window.location.host + '/ws/monitor';
  
  const statusBadge = document.getElementById('connStatus');
  const statusText = document.getElementById('connText');
  const valPPG = document.getElementById('valPPG');
  const valAccel = document.getElementById('valAccel');
  const valPing = document.getElementById('valPing');

  let lastTs = null;

  function connectWS() {
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      statusBadge.classList.add('connected');
      statusText.textContent = 'Đã kết nối';
    };
    
    ws.onclose = () => {
      statusBadge.classList.remove('connected');
      statusText.textContent = 'Mất kết nối. Đang thử lại...';
      setTimeout(connectWS, 3000);
    };
    
    ws.onerror = (err) => {
      console.error('WebSocket Error:', err);
      ws.close();
    };
    
    ws.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data);
        if (!payload.samples || payload.samples.length === 0) return;
        
        // Cập nhật DOM metric với mẫu cuối cùng
        const lastSample = payload.samples[payload.samples.length - 1];
        valPPG.textContent = lastSample.ppg_clean.toFixed(3);
        valAccel.textContent = lastSample.accel_mag.toFixed(2) + ' G';
        
        if (lastTs !== null) {
          const delta = lastSample.timestamp_ms - lastTs;
          if (delta > 0 && delta < 1000) valPing.textContent = delta + ' ms';
        }
        lastTs = lastSample.timestamp_ms;
        
        // Cập nhật mảng data cho biểu đồ
        payload.samples.forEach(sample => {
          // Xử lý PPG
          ppgChart.data.datasets[0].data.push(sample.ppg_clean);
          ppgChart.data.datasets[1].data.push(sample.ppg_raw);
          if (ppgChart.data.datasets[0].data.length > MAX_DATA_POINTS) {
            ppgChart.data.datasets[0].data.shift();
            ppgChart.data.datasets[1].data.shift();
          }
          
          // Xử lý IMU
          imuChart.data.datasets[0].data.push(sample.ax);
          imuChart.data.datasets[1].data.push(sample.ay);
          imuChart.data.datasets[2].data.push(sample.az);
          if (imuChart.data.datasets[0].data.length > MAX_DATA_POINTS) {
            imuChart.data.datasets[0].data.shift();
            imuChart.data.datasets[1].data.shift();
            imuChart.data.datasets[2].data.shift();
          }
        });
        
        ppgChart.update();
        imuChart.update();
        
      } catch (e) {
        console.error("Lỗi parse WS data", e);
      }
    };
  }

  window.addEventListener('load', connectWS);
</script>
{% endblock %}
